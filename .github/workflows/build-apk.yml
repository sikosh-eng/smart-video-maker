name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project
        run: |
          rm -rf generated_app
          flutter create --platforms=android generated_app

      - name: Copy application files
        run: |
          rm -rf generated_app/lib
          mkdir -p generated_app/lib
          cp -r lib/* generated_app/lib/
          cp pubspec.yaml generated_app/pubspec.yaml

      - name: Remove default tests
        run: |
          rm -rf generated_app/test

      - name: Set Android SDK
        working-directory: generated_app
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle.kts")
          text = path.read_text()

          if "compileSdk = 36" not in text:
              text = text.replace(
                  "android {",
                  "android {\n    compileSdk = 36",
                  1
              )

          path.write_text(text)
          PY

      - name: Get dependencies
        working-directory: generated_app
        run: flutter pub get

      - name: Analyze project
        working-directory: generated_app
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Build APK
        working-directory: generated_app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Video-Maker
          path: generated_app/build/app/outputs/flutter-apk/app-release.apk2
